spring.application.name=ellenco

# ==================================================
# SERVIDOR
# ==================================================
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.compression.enabled=true

# Sessao
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ==================================================
# BANCO DE DADOS MYSQL - AMBIENTE LOCAL
# Crie o banco: CREATE DATABASE ellenco CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# Ajuste MYSQL_USER / MYSQL_PASSWORD no ambiente caso necessario.
# Esta copia foi preparada apenas para execucao local com MySQL.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/ellenco?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

# Pool de conexoes
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ==================================================
# JPA / HIBERNATE
# ==================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

#spring.jpa.open-in-view=false
#spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ==================================================
# RESEND - ENVIO DE EMAIL
# ==================================================
resend.api.key=${RESEND_API_KEY}
resend.api.url=https://api.resend.com/emails
ellenco.from.email=${RESEND_FROM_EMAIL}
resend.from.name=Sistema Ellenco

# ==================================================
# UPLOAD DE FOTOS E ARQUIVOS
# ==================================================
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=100MB

# ==================================================
# URL PUBLICA DO SISTEMA
# ==================================================
app.base-url=${APP_BASE_URL:http://localhost:8080}
